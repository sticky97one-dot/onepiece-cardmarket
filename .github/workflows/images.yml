name: Images officielles des cartes

on:
  workflow_dispatch: {}
  push:
    paths: ["images/wanted.txt"]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Télécharger les images
        run: |
          python scripts/fetch_images.py
      - name: Enregistrer
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Images de cartes"
          git pull --rebase -q origin main
          git push
